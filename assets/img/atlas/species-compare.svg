<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
  <defs>
    <pattern id="grain" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#241812" opacity=".055"/></pattern>
  </defs>
  <rect width="800" height="500" fill="#F5EEE3"/>
  <rect width="800" height="500" fill="url(#grain)"/>
  <rect x="22" y="22" width="756" height="456" rx="18" fill="none" stroke="#E4D7C5" stroke-width="1.5"/>
  <circle cx="754" cy="46" r="4.5" fill="#B4552A"/>
  <text x="48" y="60" font-family="monospace" font-size="13" letter-spacing="3" fill="#7B6A5A">THREE SPECIES / SHAPE &amp; CHARACTER</text>
  <line x1="48" y1="76" x2="752" y2="76" stroke="#E4D7C5" stroke-width="1.5"/>

  <!-- panels -->
  <g fill="#FFFCF6" stroke="#E4D7C5" stroke-width="1.5">
    <rect x="48" y="100" width="222" height="330" rx="14"/>
    <rect x="289" y="100" width="222" height="330" rx="14"/>
    <rect x="530" y="100" width="222" height="330" rx="14"/>
  </g>

  <!-- arabica: long oval, S seam -->
  <g transform="translate(159 226)">
    <ellipse rx="46" ry="70" transform="rotate(-14)" fill="#D9B98C" stroke="#A9795B" stroke-width="2.5"/>
    <path d="M-12 -60 C14 -30 -22 8 6 60" fill="none" stroke="#8A5A34" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-58 -88 C-30 -104 30 -104 58 -88" fill="none" stroke="#E4D7C5" stroke-width="2"/>
  </g>
  <!-- robusta: round bean, straight seam -->
  <g transform="translate(400 226)">
    <ellipse rx="56" ry="60" fill="#C08A55" stroke="#8A5A34" stroke-width="2.5"/>
    <path d="M0 -54 C-8 -20 8 20 0 54" fill="none" stroke="#6B3E1E" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-58 -88 C-30 -104 30 -104 58 -88" fill="none" stroke="#E4D7C5" stroke-width="2"/>
  </g>
  <!-- liberica: large irregular bean -->
  <g transform="translate(641 226)">
    <path d="M-8 -76 C34 -72 62 -34 58 6 C54 48 22 78 -14 74 C-46 70 -62 34 -56 -8 C-50 -48 -40 -78 -8 -76Z" fill="#A9795B" stroke="#6B3E1E" stroke-width="2.5"/>
    <path d="M-4 -66 C22 -30 -20 12 6 66" fill="none" stroke="#4A2C16" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-58 -88 C-30 -104 30 -104 58 -88" fill="none" stroke="#E4D7C5" stroke-width="2"/>
  </g>

  <!-- flavour bars -->
  <g stroke-linecap="round" stroke-width="5">
    <line x1="80" y1="336" x2="238" y2="336" stroke="#B4552A" opacity=".85"/>
    <line x1="80" y1="356" x2="192" y2="356" stroke="#E4D7C5"/>
    <line x1="321" y1="336" x2="479" y2="336" stroke="#8A5A34" opacity=".85"/>
    <line x1="321" y1="356" x2="447" y2="356" stroke="#E4D7C5"/>
    <line x1="562" y1="336" x2="720" y2="336" stroke="#B85E45" opacity=".85"/>
    <line x1="562" y1="356" x2="662" y2="356" stroke="#E4D7C5"/>
  </g>
  <g font-family="monospace" font-size="13" letter-spacing="2" fill="#5E4B3C" text-anchor="middle">
    <text x="159" y="402">ARABICA</text>
    <text x="400" y="402">ROBUSTA</text>
    <text x="641" y="402">LIBERICA</text>
  </g>
</svg>
